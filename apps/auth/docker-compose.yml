services:
  auth_db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - auth_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  token_redis:
    image: redis:8
    restart: unless-stopped
    command: >
      sh -c 'set -f; exec docker-entrypoint.sh redis-server --appendonly yes
      --user default off --user "$$REDIS_USERNAME" on ">$$REDIS_PASSWORD"
      $$(cat /etc/redis/auth-user.acl)'
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ./redis/auth-user.acl:/etc/redis/auth-user.acl:ro
      - token_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user ${REDIS_USERNAME} ping | grep -q PONG"]
      interval: 5s
      retries: 5

volumes:
  auth_data:
  token_redis_data:
