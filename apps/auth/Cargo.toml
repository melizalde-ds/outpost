[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
argon2 = { version = "0.6.0", features = ["getrandom"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.27"
getrandom = "0.4.3"
prost = "0.14.4"
prost-types = "0.14"
redis = { version = "1.7.1", features = ["tokio-comp", "json", "connection-manager", "uuid"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "uuid", "chrono", "derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde", "v7"] }

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
mockall = "0.15.0"
pretty_assertions = "1.4.1"
proptest = "1.12.0"
prost-reflect = "0.16"
rstest = "0.27.0"
sqlx = { version = "0.9.0", default-features = false, features = ["migrate"] }
testcontainers-modules = { version = "0.15.0", default-features = false, features = ["aws-lc-rs", "postgres", "redis"] }
tokio = { version = "1.53.1", features = ["test-util"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
anyhow = "1.0.104"
tonic-prost-build = "0.14.6"
