[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
prost = "0.14.4"
prost-types = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "uuid", "chrono", "derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[build-dependencies]
anyhow = "1.0.104"
tonic-prost-build = "0.14.6"
