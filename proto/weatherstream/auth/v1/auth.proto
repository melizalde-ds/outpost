syntax = "proto3";

package weatherstream.auth.v1;

import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

message RegisterRequest {
  string username = 1;
  string password = 2 [debug_redact = true];
}

message RegisterResponse {
  string user_id = 1;
  string access_token = 2 [debug_redact = true];
  google.protobuf.Timestamp access_token_expires_at = 3;
  string refresh_token = 4 [debug_redact = true];
}

message LoginRequest {
  string username = 1;
  string password = 2 [debug_redact = true];
}

message LoginResponse {
  string access_token = 1 [debug_redact = true];
  google.protobuf.Timestamp access_token_expires_at = 2;
  string refresh_token = 3 [debug_redact = true];
}

message RefreshTokenRequest {
  string refresh_token = 1 [debug_redact = true];
}

message RefreshTokenResponse {
  string access_token = 1 [debug_redact = true];
  google.protobuf.Timestamp access_token_expires_at = 2;
  string refresh_token = 3 [debug_redact = true];
}
