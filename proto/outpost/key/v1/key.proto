syntax = "proto3";

package outpost.key.v1;

import "google/protobuf/timestamp.proto";

service KeyService {
  rpc SignToken(SignTokenRequest) returns (SignTokenResponse);
  rpc GetVerificationKeys(GetVerificationKeysRequest) returns (GetVerificationKeysResponse);
}

message SignTokenRequest {
  string subject = 1;
}

message SignTokenResponse {
  string token = 1 [debug_redact = true];
  string key_id = 2;
  optional VerificationKey verification_key = 3;
}

message GetVerificationKeysRequest {}

message GetVerificationKeysResponse {
  repeated VerificationKey keys = 1;
}

message VerificationKey {
  string key_id = 1;
  bytes public_key = 2;
  google.protobuf.Timestamp expires_at = 3;
}
