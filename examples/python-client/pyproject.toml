[project]
name = "python-client"
version = "0.1.0"
description = "Example Python client for the Outpost auth service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.36.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auth", "gen/outpost"]

[dependency-groups]
dev = [
    "mypy-protobuf>=5.1.0",
]
