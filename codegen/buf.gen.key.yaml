version: v2
clean: true
inputs:
  - directory: proto
    types:
      - weatherlab.key.v1.KeyService
plugins:
  - remote: buf.build/protocolbuffers/csharp
    out: apps/key-provider/src/Api/Generated
  - remote: buf.build/grpc/csharp
    out: apps/key-provider/src/Api/Generated
    opt:
      - no_client
