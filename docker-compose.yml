include:
  - ./auth/docker-compose.yml

services:
    token_redis:
      image: redis:8
      restart: unless-stopped
      command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
      environment:
        REDISCLI_AUTH: ${REDIS_PASSWORD}
      ports:
        - "6379:6379"
      volumes:
        - token_redis_data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        retries: 5

volumes:
    token_redis_data: